name: Build macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            cpu: x86-64
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            cpu: generic
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Override both target-cpu=native settings in .cargo/config.toml.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
      TARGET: ${{ matrix.target }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      ARTIFACT_NAME: dylex-${{ matrix.target }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up stable Rust
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          rustup toolchain install stable --profile minimal --no-self-update
          rustc +stable --version
          cargo +stable --version

      - name: Test
        # Live-cache tests remain opt-in; CI uses the portable fixtures.
        run: cargo +stable test --locked --target "$TARGET"

      - name: Build release binary
        run: cargo +stable build --release --locked --bin dylex --target "$TARGET"

      - name: Verify binary
        run: |
          binary="target/$TARGET/release/dylex"
          lipo -verify_arch "$EXPECTED_ARCH" "$binary"
          "$binary" --version
          "$binary" extract --help

      - name: Package binary
        run: |
          package_dir="dist/$ARTIFACT_NAME"
          mkdir -p "$package_dir"
          cp "target/$TARGET/release/dylex" LICENSE "$package_dir/"
          # tar preserves the executable bit across artifact upload/download.
          tar -C "$package_dir" -czf "dist/$ARTIFACT_NAME.tar.gz" dylex LICENSE
          cd dist
          shasum -a 256 "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"

      - name: Upload binary and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/${{ env.ARTIFACT_NAME }}.tar.gz
            dist/${{ env.ARTIFACT_NAME }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
